name: Build Ignix Launcher (exe)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build single exe
        shell: bash
        run: |
          mkdir -p input && cp IgnixLauncher.jar input/
          jpackage --type app-image --name IgnixLauncher --input input --main-jar IgnixLauncher.jar \
            --main-class pl.ignix.launcher.Main --icon icon.ico --app-version 0.1.0 --vendor "Ignix" \
            --add-modules java.base,java.desktop,java.logging,java.naming,java.sql,java.management,jdk.management,jdk.unsupported,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.charsets,jdk.zipfs \
            --dest dist
          curl -sSL -o warp.exe https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe
          ./warp.exe --arch windows-x64 --input_dir dist/IgnixLauncher --exec IgnixLauncher.exe --output IgnixLauncher.exe
          python -c "d=bytearray(open('IgnixLauncher.exe','rb').read());p=int.from_bytes(d[60:64],'little');d[p+92:p+94]=(2).to_bytes(2,'little');open('IgnixLauncher.exe','wb').write(d)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v0.1.0
          name: Ignix Launcher 0.1.0
          files: IgnixLauncher.exe
          make_latest: false
